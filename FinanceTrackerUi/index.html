<!DOCTYPE html>
<html>
<head>
    <title>Finance Tracker</title>
</head>
<body>

<h2>Finance Tracker</h2>

<hr>

<h3>Create User</h3>
<form action="https://localhost:5001/users" method="post">
    Name: <input name="name"><br><br>
    Email: <input name="email"><br><br>
    <button type="submit">Create User</button>
</form>

<hr>

<h3>Add Transaction</h3>
<form action="https://localhost:5001/transactions" method="post">
    User ID: <input name="userId"><br><br>
    Amount: <input name="amount"><br><br>
    Type:
    <select name="type">
        <option value="1">Income</option>
        <option value="2">Expense</option>
    </select><br><br>
    Category: <input name="category" value="1"><br><br>
    Date: <input name="date"><br><br>

    <button type="submit">Add Transaction</button>
</form>

<hr>

<h3>Get Report</h3>
<form action="https://localhost:5001/reports/summary" method="get">
    User ID: <input name="userId"><br><br>
    Month: <input name="month"><br><br>
    Year: <input name="year"><br><br>

    <button type="submit">Get Report</button>
</form>

</body>
</html>
